# Example fragment: include inside nginx's http block.
# Add platform-specific TLS certificates and a port-80 HTTPS redirect.
limit_req_zone $binary_remote_addr zone=apasa_login:10m rate=10r/m;
server {
    listen 443 ssl;
    server_name apasa.example.org;
    client_max_body_size 3m;
    location = /accounts/login/ {
        limit_req zone=apasa_login burst=5 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://127.0.0.1:8000;
    }
}
