<figure {% if not popup_disabled %}data-chart-popup="{{ chart.uid }}"{% endif %} class="ui-card panel data-chart seasonal-chart"><figcaption><h2>{{ chart.title }}</h2><p class="muted">{{ chart.description }}</p></figcaption>
<div class="chart-mobile" aria-label="{{ chart.title }} values">{% for bar in chart.bars %}<div class="mobile-chart-row"><div class="mobile-chart-label"><span>{{ bar.label }}</span><strong>{{ bar.display }} {{ chart.unit }}</strong></div><div class="mobile-chart-track">{% if bar.available %}<span class="{{ bar.season_class }}{% if bar.zero %} zero-marker{% endif %}" style="width:{{ bar.percent }}%"></span>{% endif %}</div></div>{% endfor %}<p class="chart-scale">Shared zero-based scale: 0–{{ chart.scale_label }} {{ chart.unit }}. Exact values and sources below.</p></div>
<div class="seasonal-chart-scroll" tabindex="0" role="region" aria-label="Season comparison chart; exact values follow">
<svg class="seasonal-svg" viewBox="0 0 880 390" role="img" aria-label="{{ chart.title }} in {{ chart.unit }}. All bars use the same zero baseline. Exact values and sources follow.">

<text x="18" y="20" class="chart-axis-label">{{ chart.unit }}</text>{% for tick in chart.ticks %}<line x1="90" x2="830" y1="{{ tick.y }}" y2="{{ tick.y }}" class="season-grid"/><text x="77" y="{{ tick.y }}" dy="5" text-anchor="end" class="chart-axis-label">{{ tick.label }}</text>{% endfor %}
{% for bar in chart.bars %}<g class="season-column {{ bar.season_class }}"><title>{{ bar.label }}: {% if bar.available %}{{ bar.value }}{% else %}Unavailable{% endif %} {{ chart.unit }} · {{ bar.state }} · {{ bar.source }}</title>{% if bar.available %}<rect class="column-front" x="{{ bar.x }}" y="{{ bar.column_y }}" width="{{ bar.column_width }}" height="{{ bar.column_height }}" rx="3"/>{% endif %}<text x="{{ bar.center }}" y="{{ bar.value_y }}" text-anchor="middle" class="season-value">{{ bar.display }}</text></g>{% endfor %}
{% for year in chart.years %}<text x="{{ year.x }}" y="350" text-anchor="middle" class="chart-label">{{ year.label }}</text>{% endfor %}
</svg></div><div class="season-legend">{% for season in chart.seasons %}<span><i class="legend-season-{{ forloop.counter0 }}" aria-hidden="true"></i>Season {{ season }}</span>{% endfor %}</div>
<details><summary>Exact values, periods and source cells</summary><div class="scroll"><table><thead><tr><th>Period</th><th>Exact source value</th><th>Status</th><th>Source</th></tr></thead><tbody>{% for bar in chart.bars %}<tr><th>{{ bar.label }}</th><td>{% if bar.available %}{{ bar.value }}{% else %}Unavailable{% endif %} {{ chart.unit }}</td><td>{{ bar.state }}</td><td>{{ bar.source }}</td></tr>{% endfor %}</tbody></table></div></details></figure>

{{ chart|json_script:chart.uid }}
