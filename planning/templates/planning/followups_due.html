<section><h2>Your follow-ups due now</h2>{% for task in due_tasks %}<article class="ui-card panel"><a href="{% url 'planning:assessment' task.assessment_id %}">{{ task.action }}</a><p>{{ task.assessment.indicator.geography }} · {{ task.assessment.indicator.name }} · {{ task.due_date|date:'j M Y' }}{% if task.overdue %} · <strong>Overdue</strong>{% endif %}</p></article>{% empty %}<p>No open actions are due today or overdue.</p>{% endfor %}</section>
